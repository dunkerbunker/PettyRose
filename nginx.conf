server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Module workers are rejected by browsers when served as octet-stream.
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }

  gzip on;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css
    text/plain;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /apps/pettyrose {
    return 301 /apps/pettyrose/;
  }

  location /apps/pettyrose/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /apps/pettyrose/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
